# Minimal Airflow stack for the e2-micro orchestration VM (T-11).
#
# Trimmed down from the official Airflow docker-compose to fit ~1 GB of RAM:
# LocalExecutor + Postgres only. NO Redis / Celery worker / Flower / triggerer.
# The daily DAG (T-12) runs a once-a-day pipeline, so a single scheduler that
# executes tasks in-process (LocalExecutor) is plenty.
#
# Build context is the repo root (..) so the image can install both
# orchestration/requirements.txt and dataflow/requirements.txt. The whole repo
# is mounted read-only at /opt/airflow/repo and put on PYTHONPATH, so the DAG
# can `import orchestration.ingest.*` and launch `dataflow.pipeline`.
#
# Usage:
#   cp .env.example .env            # then fill in the real secrets
#   docker compose build
#   docker compose up airflow-init  # one-shot: db migrate + create admin user
#   docker compose up -d            # scheduler + webserver

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: orchestration/Dockerfile
  image: trade-gcp/airflow:2.10.5
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'false'
    # A single gunicorn worker: the default (4) OOM-kills the webserver on the
    # e2-micro (1 GB). One worker is plenty for a single-user, once-a-day setup.
    AIRFLOW__WEBSERVER__WORKERS: '1'
    # Cold-booting the webserver under swap on the e2-micro can exceed gunicorn's
    # default 120s worker timeout, so the master SIGKILLs the worker and the
    # container flaps in a restart loop. Give the boot room to finish.
    AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: '300'
    # Disable the periodic gunicorn worker refresh: spinning up a replacement
    # worker transiently runs two, doubling webserver memory and OOM-ing the VM.
    AIRFLOW__WEBSERVER__WORKER_REFRESH_BATCH_SIZE: '0'
    # Keep the footprint small on a tiny VM.
    AIRFLOW__CORE__PARALLELISM: '4'
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '2'
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: '1'
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: '1'
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: '60'
    # Generous DAG-parse timeouts. Under swap pressure on the e2-micro a parse can
    # exceed the defaults (30s import / 50s processor); the scheduler then KILLs the
    # DagFileProcessor, declares the DAG "missing" and deletes it from
    # serialized_dag — so it vanishes right after appearing. Raising both keeps the
    # parse from being killed when the box is busy.
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: '120'
    AIRFLOW__CORE__DAG_FILE_PROCESSOR_TIMEOUT: '150'
    # Expose the scheduler's HTTP health endpoint on :8974 (the healthcheck below
    # hits it); without this the port stays closed and the container looks
    # unhealthy even though the scheduler is running fine.
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Make the project packages importable and the Dataflow launcher reachable.
    PYTHONPATH: /opt/airflow/repo
    # No GOOGLE_APPLICATION_CREDENTIALS on purpose: the VM runs as its attached
    # service account (trade-pipeline@…, cloud-platform scope), so the google
    # libraries authenticate through the metadata server (ADC) — reachable from
    # the container — with no key file to mount, manage or rotate. Setting the
    # var to a missing path would break ADC, so it must stay unset.
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ..:/opt/airflow/repo:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    mem_limit: 300m

  # One-shot initializer: runs as root (0:0) — not the runtime UID — so it can:
  #   (a) create and chown the bind-mounted logs/dags/plugins to ${AIRFLOW_UID}:0.
  #       The host clone owns them as the login user, so the 50000:0 container user
  #       couldn't write logs and the scheduler's DagFileProcessor crashed. Root
  #       fixes the ownership before the long-running services start.
  #   (b) tolerate an arbitrary AIRFLOW_UID. The overridden entrypoint skips the
  #       image's passwd-registration step, so a UID not baked into the image
  #       (e.g. a host `id -u`) broke `airflow` with "uid not found"; root is
  #       always present, so init runs regardless of the chosen UID.
  # It then migrates the DB and creates the admin user. Exits when done.
  airflow-init:
    <<: *airflow-common
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-admin}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-admin}" \
          --firstname admin --lastname admin --role Admin \
          --email admin@example.com || true
    restart: on-failure
    mem_limit: 512m

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    mem_limit: 800m
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      # Bind to localhost only — reach the UI through an SSH/IAP tunnel, never
      # expose 8080 to the internet (see orchestration/README.md).
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 20s
      # Long grace + many retries: the single worker boots slowly under swap on
      # the e2-micro; declaring it unhealthy too early triggers a restart loop.
      retries: 10
      start_period: 120s
    restart: unless-stopped
    mem_limit: 800m
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
